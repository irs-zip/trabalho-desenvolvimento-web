<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="box">

        <h2 class="text-center mb-4">Criar Conta</h2>

        <form id="formCadastro" method="post" novalidate>

            <div class="mb-3">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
                <div class="invalid-feedback">
                    Por favor, insira seu nome.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="invalid-feedback">
                    Por favor, insira um e-mail válido.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="telefone">Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone" required>
                <div class="invalid-feedback">
                    Por favor, insira um telefone válido.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="cpf">CPF</label>
                <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite seu CPF" minlength="14" maxlength="14" required>
                <div class="invalid-feedback">
                    Por favor, insira um CPF válido.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                <div class="invalid-feedback">
                    Por favor, insira uma senha.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="confirmar_senha">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmar_senha" placeholder="Confirme sua senha" required>
                <div class="invalid-feedback" id="confirm">
                    Por favor, confirme sua senha.
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Finalizar
            </button>

        </form>

        <a href="index.html" class="d-block text-center mt-3 text-info">
            Voltar
        </a>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/ajax.js"></script>
</body>

</html>
