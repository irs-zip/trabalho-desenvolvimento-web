<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="caixa-login mx-auto text-center" style="max-width: 400px;">

            <h2 class="mb-4">Login</h2>

            <form id="formulario" novalidate>

                <div class="mb-3 text-start">

                    <label class="form-label" name="email">
                        E-mail
                    </label>

                    <input type="email" class="form-control" placeholder="Digite seu e-mail" required>
                    <div class="invalid-feedback">
                        Por favor, insira um e-mail válido.
                    </div>
                </div>
                <div class="mb-4 text-start">

                    <label class="form-label" name="senha">
                        Senha
                    </label>

                    <input type="password" class="form-control" placeholder="Digite sua senha" required>
                    <div class="invalid-feedback">
                        Por favor, insira uma senha válida.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Entrar
                </button>

            </form>

            <a href="index.html" class="text-info text-decoration-none">
                Voltar
            </a>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
